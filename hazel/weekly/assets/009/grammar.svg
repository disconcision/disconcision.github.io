<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="335" viewBox="0 0 1000 335"><title>grammar.svg</title><path d="M13 12 L696.0 10 L705.8 13 L988 11 L990 120.00000000000001 L987 125.99999999999999 L989 209 L255.0 207 L245.2 210 L10 208 Z" fill="#e0e6ce"/><text x="32" y="53" font-family="Liberation Mono, monospace" font-size="28" font-weight="700" fill="#243c30">Var ::= &lt;ids&gt;</text><text x="32" y="97" font-family="Liberation Mono, monospace" font-size="28" font-weight="400" fill="#243c30">Cmd ::= Cmd ; Cmd | Var := Exp</text><text x="155" y="135" font-family="Liberation Mono, monospace" font-size="24" font-weight="400" fill="#243c30">| while Exp do { Cmd } | if Exp then Cmd else Cmd</text><text x="32" y="184" font-family="Liberation Mono, monospace" font-size="28" font-weight="400" fill="#243c30">Exp ::= Var | Var + Var | Var &lt; Var</text><path d="M13 242 L209.5 240 L212.35 243 L293 241 L295 282.9 L292 285.24 L294 317 L81.25 315 L78.39999999999999 318 L10 316 Z" fill="#eadcb9"/><text x="30" y="287" font-family="Rubik, sans-serif" font-size="26" font-weight="700" fill="#243c30">Edit alternatives</text><path d="M310 279 L350 279" fill="none" stroke="#243c30" stroke-width="2.5"/><path d="M341 273 L350 279 L341 285" fill="none" stroke="#243c30" stroke-width="2.5"/><path d="M368 242 L564.5 240 L567.35 243 L648 241 L650 282.9 L647 285.24 L649 317 L436.25 315 L433.4 318 L365 316 Z" fill="#e0e6ce"/><text x="384" y="287" font-family="Rubik, sans-serif" font-size="26" font-weight="700" fill="#243c30">Grammar value</text><path d="M665 279 L705 279" fill="none" stroke="#243c30" stroke-width="2.5"/><path d="M696 273 L705 279 L696 285" fill="none" stroke="#243c30" stroke-width="2.5"/><path d="M723 242 L909.0 240 L911.7 243 L988 241 L990 282.9 L987 285.24 L989 317 L787.5 315 L784.8 318 L720 316 Z" fill="#eadcb9"/><text x="737" y="287" font-family="Rubik, sans-serif" font-size="25" font-weight="700" fill="#243c30">Example writer</text></svg>