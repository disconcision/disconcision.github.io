<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="322" viewBox="0 0 1000 322"><title>where.svg</title><path d="M13 14 L339.0 12 L343.7 15 L478 13 L480 142.9 L477 150.04 L479 249 L127.5 247 L122.8 250 L10 248 Z" fill="#e0e6ce"/><text x="32" y="49" font-family="Rubik, sans-serif" font-size="20" font-weight="700" fill="#243c30">BINDINGS FIRST</text><text x="32" y="98" font-family="Liberation Mono, monospace" font-size="24" font-weight="400" fill="#243c30">let a_squared = 3 * 3 in</text><text x="32" y="141" font-family="Liberation Mono, monospace" font-size="24" font-weight="400" fill="#243c30">let b_squared = 4 * 4 in</text><text x="32" y="195" font-family="Liberation Mono, monospace" font-size="24" font-weight="400" fill="#243c30">a_squared + b_squared</text><path d="M523 14 L849.0 12 L853.7 15 L988 13 L990 142.9 L987 150.04 L989 249 L637.5 247 L632.8 250 L520 248 Z" fill="#eadcb9"/><text x="540" y="49" font-family="Rubik, sans-serif" font-size="20" font-weight="700" fill="#243c30">EXPRESSION FIRST</text><text x="540" y="98" font-family="Liberation Mono, monospace" font-size="24" font-weight="400" fill="#243c30">a_squared + b_squared</text><text x="540" y="141" font-family="Liberation Mono, monospace" font-size="24" font-weight="400" fill="#243c30">where a_squared = 3 * 3</text><text x="540" y="184" font-family="Liberation Mono, monospace" font-size="24" font-weight="400" fill="#243c30">where b_squared = 4 * 4</text><text x="30" y="295" font-family="Rubik, sans-serif" font-size="28" font-weight="700" fill="#243c30">Two readings of the same calculation: 25</text></svg>