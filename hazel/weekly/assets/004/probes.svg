<text x="262" y="192" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">200</text>
<text x="375" y="192" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">Waxing</text>
