<text x="549" y="108" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">-30</text>
<text x="703" y="108" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">220</text>
<text x="857" y="108" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">220</text>
<text x="29" y="136" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="start">orchid</text>
<text x="262" y="136" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">180</text>
<text x="375" y="136" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">New</text>
<text x="549" y="136" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">+50</text>
<text x="703" y="136" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">230</text>
<text x="857" y="136" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">230</text>
<text x="29" y="164" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="start">cactus</text>
<text x="262" y="164" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">50</text>
<text x="375" y="164" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">Waning</text>
