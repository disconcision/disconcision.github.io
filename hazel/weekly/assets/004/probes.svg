<text x="549" y="220" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">+50</text>
<text x="703" y="220" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">210</text>
<text x="857" y="220" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="middle">210</text>
<path d="M26 231 L901 226 L910 245 L905 256 L31 253 L24 241 Z" fill="#ead5c6"/>
<text x="29" y="248" fill="#b83b25" font-family="Rubik" font-size="22" font-weight="bold" text-anchor="start">rose</text>
<text x="262" y="248" fill="#b83b25" font-family="Rubik" font-size="22" font-weight="bold" text-anchor="middle">170</text>
<text x="375" y="248" fill="#b83b25" font-family="Rubik" font-size="22" font-weight="bold" text-anchor="middle">New</text>
<text x="549" y="248" fill="#b83b25" font-family="Rubik" font-size="22" font-weight="bold" text-anchor="middle">+50</text>
<text x="703" y="248" fill="#b83b25" font-family="Rubik" font-size="22" font-weight="bold" text-anchor="middle">220</text>
<text x="857" y="248" fill="#b83b25" font-family="Rubik" font-size="22" font-weight="bold" text-anchor="middle">140</text>
<text x="29" y="285" fill="#243c30" font-family="Rubik" font-size="21" font-weight="normal" text-anchor="start">Focus rose: New gives +50, so the result is 220 ml.</text>
<text x="29" y="316" fill="#243c30" font-family="Rubik" font-size="21" font-weight="normal" text-anchor="start">Change its phase to Full: 170 − 30 = 140 ml, matching the ledger.</text>
