<svg xmlns="http://www.w3.org/2000/svg" width="936" height="336" viewBox="0 0 936 336" role="img" aria-labelledby="title desc">
<title id="title">One call across the samples</title>
<desc id="desc">Derived samples from the Aligning Samples tutorial. Rose is called with base170 and phase New, so adjustment50 gives220ml, while the ledger expects140. Choosing Full changes the adjustment to−30.</desc>
<path d="M5 9 L918 3 L934 315 L926 331 L22 327 L3 310 Z" fill="#e4e6cf"/>
<text x="28" y="38" fill="#243c30" font-family="Rubik" font-size="28" font-weight="bold" text-anchor="start">One call across the samples</text>
<text x="29" y="72" fill="#50745b" font-family="Rubik" font-size="21" font-weight="bold" text-anchor="start">call</text>
<text x="262" y="72" fill="#50745b" font-family="Rubik" font-size="21" font-weight="bold" text-anchor="middle">base</text>
<text x="375" y="72" fill="#50745b" font-family="Rubik" font-size="21" font-weight="bold" text-anchor="middle">phase</text>
<text x="549" y="72" fill="#50745b" font-family="Rubik" font-size="21" font-weight="bold" text-anchor="middle">adjust</text>
<text x="703" y="72" fill="#50745b" font-family="Rubik" font-size="21" font-weight="bold" text-anchor="middle">result</text>
<text x="857" y="72" fill="#50745b" font-family="Rubik" font-size="21" font-weight="bold" text-anchor="middle">ledger</text>
<path d="M29 81 L906 81" stroke="#50745b" stroke-width="1.4" fill="none" opacity="1"/>
<text x="29" y="108" fill="#243c30" font-family="Rubik" font-size="22" font-weight="normal" text-anchor="start">fern</text>
