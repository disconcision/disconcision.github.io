<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="370" viewBox="0 0 1000 370"><title>agent-reply.svg</title><path d="M18 12 L694.0 10 L703.6999999999999 13 L983 11 L985 51.800000000000004 L982 54.08 L984 85 L257.5 83 L247.79999999999998 86 L15 84 Z" fill="#e0e6ce"/><text x="35" y="58" font-family="Rubik, sans-serif" font-size="28" font-weight="700" fill="#243c30">A reply can repair its own intermediate breakage.</text><path d="M18 122 L218.0 120 L220.89999999999998 123 L303 121 L305 188.75 L302 192.5 L304 244 L87.5 242 L84.6 245 L15 243 Z" fill="#eadcb9"/><text x="31" y="164" font-family="Rubik, sans-serif" font-size="23" font-weight="700" fill="#243c30">1. Replace definition</text><text x="31" y="211" font-family="Rubik, sans-serif" font-size="20" font-weight="400" fill="#243c30">new function signature</text><path d="M358 122 L558.0 120 L560.9 123 L643 121 L645 188.75 L642 192.5 L644 244 L427.5 242 L424.6 245 L355 243 Z" fill="#e0e6ce"/><text x="371" y="164" font-family="Rubik, sans-serif" font-size="23" font-weight="700" fill="#243c30">2. Repair its callers</text><text x="371" y="211" font-family="Rubik, sans-serif" font-size="20" font-weight="400" fill="#243c30">uses match the change</text><path d="M698 122 L898.0 120 L900.9 123 L983 121 L985 188.75 L982 192.5 L984 244 L767.5 242 L764.6 245 L695 243 Z" fill="#eadcb9"/><text x="711" y="164" font-family="Rubik, sans-serif" font-size="23" font-weight="700" fill="#243c30">3. Check whole reply</text><text x="711" y="211" font-family="Rubik, sans-serif" font-size="20" font-weight="400" fill="#243c30">accept or roll back</text><path d="M312 182 L346 182" fill="none" stroke="#243c30" stroke-width="2.5" stroke-dasharray=""/><path d="M337 176 L346 182 L337 188" fill="none" stroke="#243c30" stroke-width="2.5"/><path d="M652 182 L686 182" fill="none" stroke="#243c30" stroke-width="2.5" stroke-dasharray=""/><path d="M677 176 L686 182 L677 188" fill="none" stroke="#243c30" stroke-width="2.5"/><text x="25" y="298" font-family="Liberation Mono, monospace" font-size="25" font-weight="400" fill="#243c30">Paths: Geo/scale · scale:definition · &quot;empty list&quot;</text><text x="25" y="342" font-family="Rubik, sans-serif" font-size="22" font-weight="400" fill="#243c30">With the default checks: no new errors, no dangling uses.</text></svg>