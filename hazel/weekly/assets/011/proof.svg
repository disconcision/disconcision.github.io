<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="240" viewBox="0 0 1000 240"><title>proof.svg</title><path d="M13 12 L342.5 10 L347.25 13 L483 11 L485 109.00000000000001 L482 114.39999999999999 L484 189 L128.75 187 L124.0 190 L10 188 Z" fill="#e0e6ce"/><text x="30" y="47" font-family="Rubik, sans-serif" font-size="21" font-weight="700" fill="#243c30">OPEN CONDITION</text><text x="30" y="92" font-family="Liberation Mono, monospace" font-size="28" font-weight="400" fill="#243c30">8 / z == 8 / z</text><text x="30" y="133" font-family="Liberation Mono, monospace" font-size="27" font-weight="400" fill="#243c30">requires z != 0</text><text x="30" y="171" font-family="Rubik, sans-serif" font-size="29" font-weight="700" fill="#b83b25">incomplete</text><path d="M518 12 L847.5 10 L852.25 13 L988 11 L990 109.00000000000001 L987 114.39999999999999 L989 189 L633.75 187 L629.0 190 L515 188 Z" fill="#eadcb9"/><text x="535" y="47" font-family="Rubik, sans-serif" font-size="21" font-weight="700" fill="#243c30">UNFINISHED CITATION</text><text x="535" y="92" font-family="Rubik, sans-serif" font-size="27" font-weight="400" fill="#243c30">Local proof finished</text><text x="535" y="133" font-family="Rubik, sans-serif" font-size="24" font-weight="400" fill="#243c30">Assumes an unproven lemma</text><text x="535" y="171" font-family="Rubik, sans-serif" font-size="29" font-weight="700" fill="#243c30">proven*</text><text x="25" y="229" font-family="Rubik, sans-serif" font-size="25" font-weight="400" fill="#243c30">A completed local step is not the whole dependency story.</text></svg>