<title id="title">An ID tally across the whole test program</title>
<desc id="desc">PR2593 updates definition z from (21,22) to (20,22). With structural matching, 9 of 10 expression IDs across the full program survive; without matching, 6 survive. The ten slots are a count, not syntax order.</desc>
